name: pytest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: ['dandelion-v*']
  workflow_dispatch:

jobs:
  pytest:
    if: ${{ !cancelled() && github.repository == 'Dandelion-Science/GLMsingle' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ contains(matrix.runner, 'codebuild') && format('{0}-{1}-{2}', matrix.runner, github.run_id, github.run_attempt) || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        python-version: ["3.14"]
        include:
          - os: linux
            runner: codebuild-dandelion-linux-arm64
          - os: macos
            runner: self-hosted-macos-arm64
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.ARN_IAM_ROLE_GHA_CORE }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Dandelion-Science/github-actions/setup-uv@main
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync -q --locked --no-default-groups --group test
      - run: pytest tests
