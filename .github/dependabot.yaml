version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dandelion-v1"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dandelion-v1"
    schedule:
      interval: "weekly"
    versioning-strategy: lockfile-only
