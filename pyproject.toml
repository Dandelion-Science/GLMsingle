[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools >= 64.0.0', 'setuptools_scm>=8']

[dependency-groups]
test = [
  'pytest-timeout',
  'pytest>=8.0',
]

[project]
classifiers = [
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Programming Language :: Python :: 3 :: Only',
  'Topic :: Scientific/Engineering',
]
dependencies = [
  'fracridge',
  'h5py',
  'matplotlib',
  'nibabel',
  'numpy',
  'pandas',
  'scikit-learn',
  'scipy',
  'tqdm',
]
description = 'GLMsingle (Dandelion fork of cvnlab/GLMsingle).'
dynamic = ['version']
keywords = [
  'fmri',
  'glm',
  'neuroscience',
]
license = {text = 'LGPL-3.0-or-later'}
name = 'dandelion-glmsingle'
readme = 'README.md'
requires-python = '>=3.10'

[project.urls]
source = 'https://github.com/Dandelion-Science/GLMsingle'
upstream = 'https://github.com/cvnlab/GLMsingle'

[tool.pytest.ini_options]
addopts = ['--color=yes', '--durations=20', '--strict-config', '--tb=short', '-ra', '-v']
minversion = '8.0'
timeout = 600

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
glmsingle = ['hrf/*.tsv']

[tool.setuptools.packages.find]
include = ['glmsingle*']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'

[tool.uv]
default-groups = ['test']
